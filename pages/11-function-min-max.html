<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Avanzado - Function min() y max()</title>
	<style>
		.caja {
			width: min(500px, 50%);
			height: 500px;
			background-color: blue;
			border: 1px solid black;
			border-radius: 5px;
			margin: auto;
		}

		.fuente {
			font-size: max(20px, 3vw);
		}
	</style>
</head>
<body>
	<div class="caja"></div>
	<p class="fuente">Tamaño de la letra</p>
</body>
</html>

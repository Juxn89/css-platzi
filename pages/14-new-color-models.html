<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Advanced CSS - New Color Models (OKLCH, OKLAB, HWB)</title>
	<style>
		div {
			color: black;
			padding: 20px;
			text-align: center;
			font-size: 20px;
		}

		.oklch {
			/* background-color: red; */
			background-color: oklch(0.57 0.1363 311.03);
		}

		.oklab {
			/* background-color: green; */
			background-color: oklab(67% 0.130 0.068);
		}

		.hwb {
			background-color: hwb(165 6% 46%);
		}
	</style>
</head>
<body>
	<div class="oklch">Color with OKLCH model</div>
	<div class="oklab">Color with OKLAB model</div>
	<div class="hwb">Color with HWB model</div>
</body>
</html>

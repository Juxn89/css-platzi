<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Advanced CSS - Accent Color</title>
	<style>
		input[type="checkbox"],
		input[type="radio"] {
				accent-color: red;
		}

		label:has(input:checked) {
				color: red;
		}
	</style>
</head>
<body>
	<form>
		<label>
			<input type="checkbox"> Opción 1
		</label>
		<label>
			<input type="checkbox"> Opción 2
		</label>
		<br><br>
		<label>
			<input type="radio" name="grupo"> Opción A
		</label>
		<label>
			<input type="radio" name="grupo"> Opción B
		</label>
	</form>
</body>
</html>

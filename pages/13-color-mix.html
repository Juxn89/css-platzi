<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Advanced CSS Color Mixing</title>
	<style>
		.box {
			background-color: darkblue;
			height: 200px;
			width: 200px;
			margin: auto;
			transition: background-color 1s ease-in-out;
		}

		.box:hover {
			background-color: color-mix(in srgb, darkblue 50%, red 50%);
		}
	</style>
</head>
<body>
	<div class="box"></div>
</body>
</html>

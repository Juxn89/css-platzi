<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Avanzado</title>
	<style>
		:root {
			--color-principal: rgb(78, 78, 150);
			--color-secundario: rgb(37, 90, 37);
			--tamano-grande: 2rem;
			--tamano-pequeno: 1rem;
			--fuente-titulo: 'Arial', sans-serif;
			--fuente-parrafo: 'Georgia', serif;
		}

		h1 {
			color: var(--color-principal);
			font-size: var(--tamano-grande);
			font-family: var(--fuente-titulo);
		}

		p {
			color: var(--color-secundario);
			font-size: var(--tamano-pequeno);
			font-family: var(--fuente-parrafo);
		}
	</style>
</head>
<body>

	<h1>Vamos a ver variables en CSS</h1>
	<p>Nos va a permitir ahorrar mucho código y esfuerzo</p>
	<p>Nos va a permitir ahorrar mucho código y esfuerzo</p>
	<p>Nos va a permitir ahorrar mucho código y esfuerzo</p>

</body>
</html>
